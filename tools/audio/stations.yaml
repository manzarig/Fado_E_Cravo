# Authoring manifest for the radio stations. build_stations.py turns this into
#   <out-root>/stations/<station_id>.json   (schema v1, see CLAUDE.md)
#   <out-root>/sounds.json                  (together with extra_sounds.json)
#
# Clip ids are fixed by the audio contract in CLAUDE.md. A clip's kind comes from its prefix
# (ident_ news_ notice_ market_prices_ signoff_ ad_ announce_ request_ personal_messages_ breaking_
# interval_); every id in `music:` is kind "music".
#
# How a phase reads:
#   opening        played once, in order, when the station starts its phase.
#   programs       the main schedule: an ORDERED cycle, played in the order written. Radio Tejo relies on
#                  this: an announce_N / request_N always sits directly before the song it introduces.
#   interstitials  a pool of short items; one is inserted after every `interstitial_every` programs
#                  (count each announce / request as one item, as Radio Tejo does: announce + song = 2).
#   on_air: false  the station is silent in that phase; every list is empty and interstitial_every is 0.
# `breaking` is the pool for breaking-news interruptions; breaking_* clips appear nowhere else.
#
# Time-of-day wording in the scripts fixes where some clips may be scheduled:
#   news_morning_1 says "oito horas"          -> dawn only
#   news_evening_1/2 say "vinte e uma horas"  -> dusk only
#   signoff_1 says "vinte e três horas"       -> night only
# Every other clip is time-neutral. Phases: dawn 23000-1000, day 1000-12000, dusk 12000-13800,
# night 13800-23000 (world ticks).

# Music inventory (shared by the stations; generated by compose_test_music.py into .cache/music/<id>.wav).
music:
  - fado_menor_1
  - fado_menor_2
  - fado_corrido_1
  - marcha_1
  - guitarrada_1
  - orquestra_1
  - interval_lusitana
  - interval_atlantico

# SFX inventory (generated by make_sfx.py into .cache/sfx/<id>.wav): id -> attenuation_distance.
# All SFX are non-streaming. Radio-borne sounds carry 64 blocks, UI clicks 16.
sfx:
  static_loop: 64
  carrier_hiss: 64
  tuning_whistle: 64
  tube_warmup: 64
  power_on: 16
  power_off: 16

# Optional overrides: use a real recording instead of the generated WAV for one clip.
# Key is "<station_id or music or sfx>/<clip>", value is a path relative to tools/audio/ (or absolute);
# any file ffmpeg can read works. An overridden speech clip is not sent to Piper.
#   radio_tejo/ad_1: recordings/ad_1.wav
#   music/fado_menor_1: recordings/fado_menor_1.flac
#   sfx/power_on: recordings/click_on.wav
source: {}

stations:
  # ---------------------------------------------------------------------------------------------
  # Emissora Lusitana - formal state radio. No ads. Orchestral and fado. Strong signal.
  # Closes the broadcasting day with the sign-off (night) and then idles on its interval signal.
  # ---------------------------------------------------------------------------------------------
  - id: emissora_lusitana
    frequency_khz: 670
    signal_strength: 1.0
    phases:
      dawn:
        on_air: true
        opening: [ident_1, news_morning_1]
        programs: [orquestra_1, fado_menor_1]
        interstitials: [notice_1]
        interstitial_every: 2
      day:
        on_air: true
        opening: [interval_lusitana, ident_2]
        programs: [orquestra_1, fado_menor_2, guitarrada_1, fado_menor_1]
        interstitials: [market_prices_1, notice_1, notice_2]
        interstitial_every: 2
      dusk:
        on_air: true
        opening: [news_evening_1]
        programs: [fado_menor_1, orquestra_1]
        interstitials: [news_evening_2]
        interstitial_every: 1
      night:
        on_air: true
        opening: [signoff_1]
        programs: [interval_lusitana]
        interstitials: []
        interstitial_every: 0
    breaking: [breaking_1]

  # ---------------------------------------------------------------------------------------------
  # Radio Tejo - popular station. Fado and marchas, an ad after every 2 items, announcer song
  # intros, listener requests. Runs all day and keeps a fado programme at night.
  # Programs are paired (announce/request + song) so an ad always lands between pairs.
  # ---------------------------------------------------------------------------------------------
  - id: radio_tejo
    frequency_khz: 1035
    signal_strength: 1.0
    phases:
      dawn:
        on_air: true
        opening: [ident_1]
        programs: [announce_2, marcha_1, announce_1, fado_menor_1]
        interstitials: [ad_1, ad_2]
        interstitial_every: 2
      day:
        on_air: true
        opening: [ident_2]
        programs: [announce_3, guitarrada_1, request_1, fado_corrido_1, announce_2, marcha_1, announce_1, fado_menor_2]
        interstitials: [ad_1, ad_2, ad_3, ad_4]
        interstitial_every: 2
      dusk:
        on_air: true
        opening: [ident_1]
        programs: [announce_1, fado_menor_2, announce_2, marcha_1]
        interstitials: [ad_3, ad_4]
        interstitial_every: 2
      night:
        on_air: true
        opening: [ident_2]
        programs: [fado_menor_2, fado_corrido_1, announce_1, fado_menor_1]
        interstitials: [ad_2, ad_4]
        interstitial_every: 2
    breaking: [breaking_1]

  # ---------------------------------------------------------------------------------------------
  # Radio Atlantico - weak foreign-service signal, on air only at night. News in Portuguese,
  # an interval signal and coded personal messages, with a little music between bulletins.
  # ---------------------------------------------------------------------------------------------
  - id: radio_atlantico
    frequency_khz: 1440
    signal_strength: 0.55
    phases:
      dawn: &off_air
        on_air: false
        opening: []
        programs: []
        interstitials: []
        interstitial_every: 0
      day: *off_air
      dusk: *off_air
      night:
        on_air: true
        opening: [interval_atlantico, ident_1]
        programs: [news_1, fado_menor_1, news_2, orquestra_1, news_3, guitarrada_1]
        interstitials: [personal_messages_1, interval_atlantico]
        interstitial_every: 2
    breaking: [breaking_1]
